# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/" 
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # FORK: protobuf-java and protoc share the one libprotobuf version ref and stay on 3.x: the Confluent 7.9.1
    # test stack is built on protobuf 3 (ProtobufIngestTest fails with VerifyError on 4.x). Re-open with FUT-03, see docs/FORK-DELTA.md.
    ignore:
      - dependency-name: "com.google.protobuf:protobuf-java"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.protobuf:protoc"
        update-types: ["version-update:semver-major"]
      
  # FORK: keeps the SHA pins of every fork-owned workflow current (tests.yaml, release.yaml,
  # pre-release.yaml, increment-version.yml and any added later). Only upstream's integrationTests.yaml
  # is excluded: it stays byte-identical to upstream and unpinned, so a stray bump PR for it is closed,
  # not merged. WorkflowActionPinGuardUnitTest fails if this list changes.
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - ".github/workflows/integrationTests.yaml"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
