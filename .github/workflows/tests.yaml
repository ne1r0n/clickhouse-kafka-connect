# FORK MODIFICATION: this workflow was rewritten to drop the upstream client-by-ClickHouse
# matrix (V1/V2 x 23.7/24.3/latest/cloud). This fork tests only ClickHouse `latest` with
# client V2, matching production usage; the removed legs (V1, 23.7, 24.3, and the Cloud leg
# with its credentials guard) are out of scope here.
# See .planning/REQUIREMENTS.md CI-01..04 for the reasoning behind this reduction.
#
# The trigger is branch pushes only (CI-08). A tag pushed onto an already-pushed SHA joins the
# same SHA-keyed concurrency group and cancels the branch run, as happened on c61d90ce. The
# release workflows are workflow_dispatch, so nothing depends on tag-triggered tests.
# The fork-count step prints the value the reportTestForks Gradle task reads from the test task, and
# also emits a notice annotation, because job logs are not readable without repository admin rights
# (CI-09, CI-14).
name: ClickHouse Kafka Connect Tests CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: ClickHouse latest Client version V2 tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Report test fork count
        run: |
          forks="$(./gradlew -q --console=plain reportTestForks | tail -n 1)"
          case "$forks" in
            ''|*[!0-9]*)
              echo "::error::reportTestForks did not print an integer: '${forks}'"
              exit 1
              ;;
          esac
          msg="runner nproc=$(nproc), Gradle maxParallelForks=${forks} (read from the test task in build.gradle.kts)"
          echo "$msg"
          echo "### Test fork count" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Test fork count::${msg}"

      - name: Compile integration-test sources
        run: ./gradlew compileIntegrationTestJava

      - name: Run tests
        run: ./gradlew test

      - name: Generate coverage summary
        if: always()
        run: python3 .github/scripts/jacoco_summary.py

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: build/reports/jacoco/
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: build/reports/tests/
          retention-days: 14
