# FORK MODIFICATION: hardening only, the behavior is upstream's. Every action is pinned to a full commit
# SHA with a version comment, Node is the current LTS (24), semver is installed at an exact version
# without install scripts, and the token scopes are granted on the job instead of the workflow.
# Known and left unfixed: semver.inc returns null for a version such as v1.7.0_gg4, so a dispatch would
# write the text vnull into VERSION. The fork bumps VERSION by hand.
name: Increment Version

on:
  workflow_dispatch:
    inputs:
        version:
          type: choice
          description: 'Version - patch, minor, or major'     
          required: true
          options: 
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          # checkout keeps its default persisted credentials: "Commit and push" pushes a branch
          fetch-depth: 0 # this is required to see all branches
    - name: Configure Git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Action"
        git config --global --add --bool push.autoSetupRemote true
    - name: Setup Node.js environment
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install dependencies
      run: npm install --no-save --ignore-scripts semver@7.8.5
    - name: Increment version
      run: |
        echo "Incrementing version..."
        VERSION=$(cat VERSION)
        NEW_VERSION=$(node -p "require('semver').inc('$VERSION', '${{ github.event.inputs.version }}')")
        echo "v$NEW_VERSION" > VERSION
        echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
        echo "New version is $NEW_VERSION"
    - name: Commit and push
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git checkout -b update-version-${{ env.NEW_VERSION }}
        git add VERSION
        git commit -m "Increment version to ${{ env.NEW_VERSION }}"
        git push
        gh pr create --title "Automatic version increment ${{ env.NEW_VERSION }}" --body "This is an automated PR to increment the version."
